    tier: main

  wsss4luad_3class:
    root: /raid1/xwan0900/datasets/WSSS4LUAD/raw
    class_names: [tumor, stroma, normal]
    expected_images: 10091
    split_policy: pending_labeled_train_val_test_definition
    builder: wsss4luad_parquet
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Train contains 1181/1680/1832 clean single-label tumor/stroma/normal examples, but official validation/test have no direct class labels. Refusing to fabricate labels or a final split.

  oral_oscc_100x:
    root: /raid1/xwan0900/datasets/OralOSCC
    class_names: [Normal, OSCC]
    expected_images: 528
    split_policy: pending_split_keep_100x_separate
    builder: oral_oscc
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Archive structure and 100x counts are known, but exact TRAIN/VAL/TEST counts have not been fixed and the archive has not yet been frozen into a manifest source tree.

  oral_oscc_400x:
    root: /raid1/xwan0900/datasets/OralOSCC
    class_names: [Normal, OSCC]
    expected_images: 696
    split_policy: pending_split_keep_400x_separate
    builder: oral_oscc
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Archive structure and 400x counts are known, but exact TRAIN/VAL/TEST counts have not been fixed and the archive has not yet been frozen into a manifest source tree.

  endometrial_4class:
    root: /raid1/xwan0900/datasets/Endometrial/extracted/histopathological image dataset for ET
    class_names: [EA, EP, EH, NE]
    expected_images: 3302
    split_policy: pending_split_balanced_535_per_class
    builder: endometrial_4class
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Class structure is verified (535/636/798/1333), but exact TRAIN/VAL/TEST counts were not specified. Refusing to apply a generic split silently.

  osteosarcoma_3class:
    root: /raid1/xwan0900/datasets/Osteosarcoma/extracted/OsteosarcomaTumorAssessment
    class_names: [Non-Tumor, Viable-Tumor, Non-Viable-Tumor]
    expected_images: 1144
    split_policy: pending_patient_aware_supplementary_protocol
    builder: osteosarcoma
    protocol_status: blocked
    balance_policy: balanced
    tier: supplementary
    blocker: Only about four patients are represented. A defensible patient-aware supplementary split must be fixed before evaluation.

  gashissdb_binary:
    root: /raid1/xwan0900/datasets/GasHisSDB/extracted/GasHisSDB
    class_names: [Normal, Abnormal]
    expected_images: 245196
    split_policy: pending_single_resolution_selection_then_documented_4_4_2_split
    builder: gashissdb
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Resolutions 80/120/160 are all present. One resolution must be selected explicitly before freezing the <=1000/class benchmark; the dataset README documents a 4:4:2 train/val/test experiment split.

  renalcell_6class:
    root: /raid1/xwan0900/datasets/RenalCell/extracted/tissue_classfication
    class_names: [blood, cancer, empty, normal, other, stroma]
    expected_images: 39458
    split_policy: pending_tcga_overlap_check_balanced_544_per_class
    builder: renalcell_6class
    protocol_status: blocked
    balance_policy: balanced
    tier: supplementary
    blocker: TCGA-KIRC provenance may overlap PanNuke pretraining material. Keep blocked as a primary transfer benchmark until overlap is checked.

  ebhi_seg_6class:
    root: /raid1/xwan0900/datasets/EBHI-SEG
    class_names: [Adenocarcinoma, High-grade IN, Low-grade IN, Normal, Polyp, Serrated adenoma]
    expected_images: 2228
    split_policy: pending_full_dataset_natural_imbalance_split
    builder: ebhi_seg_6class
    protocol_status: blocked
    balance_policy: natural_imbalance
    tier: supplementary
    blocker: All 2228 images must be retained without oversampling, but the exact TRAIN/VAL/TEST split rule has not been fixed. Refusing to invent one.

  lc25000_5class:
    root: /raid1/xwan0900/datasets/LC25000
    class_names: [colon_aca, colon_n, lung_aca, lung_n, lung_scc]
    expected_images: 25000
    split_policy: pending_augmentation_family_recovery
    builder: lc25000_5class
    protocol_status: blocked
    balance_policy: balanced
    tier: supplementary
    blocker: Random splitting would leak augmentation families. Source-family grouping must be recovered before a final manifest can be frozen.

  pcam_binary:
    root: /raid1/xwan0900/datasets/PCam
    class_names: [normal, tumor]
    expected_images: 32768
    split_policy: pending_complete_local_official_split_inventory
    builder: pcam_binary
    protocol_status: blocked
    balance_policy: balanced
    tier: supplementary
    blocker: The current local copy exposes the official test HDF5 files but not a verified complete train/validation set. Refusing to substitute an arbitrary split.

  pcgipi_he_4class:
    root: /raid1/xwan0900/datasets/PCGIPI
    class_names: [Normal, G1, G2, G3]
    expected_images: 59
    split_policy: pending_published_he_patch_extraction_and_source_isolation
    builder: pcgipi_he_4class
    protocol_status: blocked
    balance_policy: balanced
    tier: supplementary
    blocker: H&E originals are only 7/27/15/10 images. The published patch-extraction protocol and source-image isolation must be reproduced before this becomes a patch benchmark.
