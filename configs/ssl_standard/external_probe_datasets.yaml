datasets:
  mhist:
    root: ${SSL_DATA_ROOT}/MHIST/extracted/full/MHIST
    class_names: [HP, SSA]
    expected_images: 3152
    split_policy: deterministic_balanced_min1000_then_8_1_1_792_99_99
    builder: mhist_balanced_8_1_1
    protocol_status: ready
    balance_policy: balanced
    tier: main

  crc_val_he_7k:
    root: ${SSL_DATA_ROOT}/CRC-VAL-HE-7K
    class_names: [ADI, BACK, DEB, LYM, MUC, MUS, NORM, STR, TUM]
    expected_images: 7180
    split_policy: deterministic_equal_class_339_then_stratified_271_34_34
    builder: crc_val_he_7k
    protocol_status: ready
    balance_policy: balanced
    tier: main

  breakhis_8subtype:
    root: ${SSL_DATA_ROOT}/BreakHis/BreaKHis_v1/histology_slides/breast
    class_names: [adenosis, ductal_carcinoma, fibroadenoma, lobular_carcinoma, mucinous_carcinoma, papillary_carcinoma, phyllodes_tumor, tubular_adenoma]
    expected_images: 7909
    split_policy: deterministic_equal_subtype_sample_444_then_image_stratified_356_44_44
    builder: breakhis_8subtype
    protocol_status: ready
    balance_policy: balanced
    tier: main

  kather_2016:
    root: ${SSL_DATA_ROOT}/Kather2016/raw/data
    class_names: [ADIPOSE, COMPLEX, DEBRIS, EMPTY, LYMPHO, MUCOSA, STROMA, TUMOR]
    expected_images: 5000
    split_policy: balanced_min1000_smallest625_then_8_1_1_500_63_62
    builder: kather_2016_parquet
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Split is frozen at 625/class with 500/63/62 TRAIN/VAL/TEST; manifest builder still needs implementation.

  bach:
    root: ${SSL_DATA_ROOT}/BACH/raw/data
    class_names: [Normal, Benign, InSitu, Invasive]
    expected_images: 400
    split_policy: balanced_min1000_smallest100_then_8_1_1_80_10_10_labeled400_only
    builder: bach_parquet
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Split is frozen at 100/class with 80/10/10 TRAIN/VAL/TEST using the 400 labeled images only; manifest builder still needs implementation.

  sicapv2_4class:
    root: ${SSL_DATA_ROOT}/SICAPv2/extracted/SICAPv2
    class_names: [NC, G3, G4, G5]
    expected_images: 12081
    split_policy: balanced_min1000_smallest948_then_group_aware_8_1_1_758_95_95
    builder: sicapv2_4class_balanced_8_1_1
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: New protocol is frozen at 948/class with target 758/95/95; the old official-partition manifest is retired and a source-group-aware 8:1:1 builder must be implemented before evaluation.

  wsss4luad_3class:
    root: ${SSL_DATA_ROOT}/WSSS4LUAD/raw
    class_names: [tumor, stroma, normal]
    expected_images: 10091
    split_policy: clean_single_label_pool_balanced_1000_per_class_then_group_aware_800_100_100
    builder: wsss4luad_parquet
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Clean single-label counts support 1000/class and the 800/100/100 target is frozen; source-group-safe manifest construction still needs implementation.

  oral_oscc:
    root: ${SSL_DATA_ROOT}/OralOSCC
    class_names: [Normal, OSCC]
    expected_images: 1224
    split_policy: whole_dataset_100x_400x_combined_natural_distribution_group_aware_8_1_1
    builder: oral_oscc_combined
    protocol_status: blocked
    balance_policy: natural_imbalance
    tier: main
    blocker: Use all 1224 images as one Normal-vs-OSCC task with 100x and 400x combined and no balancing; source/patient-safe grouping must be resolved before freezing the 8:1:1 manifest.

  endometrial_4class:
    root: ${SSL_DATA_ROOT}/Endometrial/extracted/histopathological image dataset for ET
    class_names: [EA, EP, EH, NE]
    expected_images: 3302
    split_policy: balanced_min1000_smallest535_then_group_aware_8_1_1_428_54_53
    builder: endometrial_4class
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Split is frozen at 535/class with target 428/54/53; source-group-safe manifest construction still needs implementation.

  osteosarcoma_3class:
    root: ${SSL_DATA_ROOT}/Osteosarcoma/extracted/OsteosarcomaTumorAssessment
    class_names: [Non-Tumor, Viable-Tumor, Non-Viable-Tumor]
    expected_images: 1144
    split_policy: balanced_min1000_smallest_usable_class_then_patient_grouped_approximately_8_1_1
    builder: osteosarcoma
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Only about four patients are represented; patient grouping takes priority over exact 8:1:1 counts, so a defensible patient-grouped split must be fixed before evaluation.

  gashissdb_binary:
    root: ${SSL_DATA_ROOT}/GasHisSDB/extracted/GasHisSDB
    class_names: [Normal, Abnormal]
    expected_images: 245196
    split_policy: select_one_resolution_then_balanced_1000_per_class_800_100_100
    builder: gashissdb
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: The balanced 1000/class and 800/100/100 rule is frozen, but one of the 80/120/160 resolutions must still be selected explicitly.

  renalcell_6class:
    root: ${SSL_DATA_ROOT}/RenalCell/extracted/tissue_classfication
    class_names: [blood, cancer, empty, normal, other, stroma]
    expected_images: 39458
    split_policy: balanced_min1000_smallest544_then_source_grouped_8_1_1_435_55_54_after_overlap_check
    builder: renalcell_6class
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Target is 544/class with 435/55/54 after source grouping; TCGA-KIRC overlap with PanNuke pretraining material must be checked first.

  ebhi_seg_6class:
    root: ${SSL_DATA_ROOT}/EBHI-SEG
    class_names: [Adenocarcinoma, High-grade IN, Low-grade IN, Normal, Polyp, Serrated adenoma]
    expected_images: 2228
    split_policy: whole_dataset_natural_distribution_source_grouped_approximately_8_1_1
    builder: ebhi_seg_6class
    protocol_status: blocked
    balance_policy: natural_imbalance
    tier: main
    blocker: Use all 2228 images with the natural class distribution and no balancing; source/specimen groups encoded in filenames must stay within one split when freezing the approximately 8:1:1 manifest.

  lc25000_5class:
    root: ${SSL_DATA_ROOT}/LC25000
    class_names: [colon_aca, colon_n, lung_aca, lung_n, lung_scc]
    expected_images: 25000
    split_policy: balanced_1000_per_class_800_100_100_with_augmentation_family_grouping
    builder: lc25000_5class
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Target is 1000/class with 800/100/100, but augmentation-family grouping must be recovered first to prevent leakage.

  pcam_binary:
    root: ${SSL_DATA_ROOT}/PCam
    class_names: [normal, tumor]
    expected_images: 32768
    split_policy: balanced_1000_per_class_800_100_100_preserving_official_source_grouping
    builder: pcam_binary
    protocol_status: blocked
    balance_policy: balanced
    tier: main
    blocker: Target is 1000/class with 800/100/100, but the current local copy does not yet contain a verified complete train/validation inventory.
