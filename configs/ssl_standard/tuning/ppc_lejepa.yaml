method: ppc_lejepa
budget: {epochs: 20, validation_interval_epochs: 5, plateau_early_stopping: false, hard_nonfinite_stop: true}
parameters:
  ppc_lambda:
    candidates: [0.01, 0.05, 0.10]
    baseline_value: 0.0
    default_smoke_value: 0.05
    source_reference: standard LeJEPA corresponds to lambda=0
search:
  strategy: sequential_greedy
  order: [ppc_lambda]
  fixed_learning_rate: 0.0005
selection: {metric: linear_val_macro_f1, test_used: false, tie_break: prefer_smaller_lambda}
