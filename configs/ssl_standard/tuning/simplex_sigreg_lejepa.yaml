method: simplex_sigreg_lejepa
budget: {epochs: 20, validation_interval_epochs: 5, plateau_early_stopping: false, hard_nonfinite_stop: true}
parameters:
  learning_rate:
    candidates: [0.0001, 0.0005, 0.001]
    source_value: 0.0005
    source_reference: galilai-group/lejepa README GOTO hyperparameters
  simplex_components:
    candidates: [2, 4, 8, 16, 32, 64]
    selection_role: method_hyperparameter
search:
  strategy: sequential_greedy
  order: [simplex_components, learning_rate]
  fixed_simplex_sigma: 1.0
  k_stage_learning_rate: 0.0005
selection:
  metric: linear_val_macro_f1
  test_used: false
  tie_break:
    simplex_components: smaller_K
    learning_rate: prefer_source_value_then_first_candidate
