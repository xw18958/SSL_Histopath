seed: 20260903
data_root: /raid1/xwan0900/datasets/PanNuke/data
plip_config_dir: /raid1/xwan0900/models/plip_model
output_dir: /raid1/xwan0900/SSL_proj/outputs/ijepa_lejepa_fairness

benchmark:
  batch_size: 128
  num_workers: 8
  cache_in_ram: true
  warmup_steps: 20
  measured_steps: 100
  bf16: true
  tf32: true
  learning_rate: 0.0001
  weight_decay: 0.04

ijepa:
  image_size: 256
  patch_size: 32
  hidden_size: 768
  predictor_dim: 384
  predictor_depth: 4
  predictor_heads: 6
  predictor_mlp_ratio: 4
  dropout: 0.0
  target_count: 4
  ema_momentum: 0.996
  gradient_clip_norm: 5.0

lejepa:
  global_views: 2
  local_views: [4, 6]
  global_size: 256
  local_size: 96
  global_scale: [0.3, 1.0]
  local_scale: [0.05, 0.3]
  lambda: 0.05
  projector_dim: 512
  projector_hidden_dim: 2048
  sigreg_slices: 1024
  sigreg_points: 17
  sigreg_t_max: 3.0
  horizontal_flip_p: 0.5
  color_jitter_p: 0.8
  grayscale_p: 0.2
  gaussian_blur_p: 0.5
  solarize_p: 0.2
